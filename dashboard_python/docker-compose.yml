# Dashboard aislado: compose propio, sin tocar el de otras aplicaciones de la VM.
# Publica solo en 127.0.0.1; la entrada desde internet es el túnel de Cloudflare (con Access delante).
services:
  dossier:
    build: .
    container_name: dossier-financiero
    restart: unless-stopped
    ports:
      - "127.0.0.1:8050:8050"
    env_file: ajustes.conf    # DASH_TOKEN (secreto; permisos 600) y EXPIRA. Ver ajustes.ejemplo
    environment:
      ANIO_VERTICAL_1: "2024"
      ANIO_VERTICAL_2: "2025"
      LOGO_URL: ""
    volumes:
      - ./data:/datos:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8050/salud').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
